# Repository and tag are overridden by the trusted-PR lint-test workflow to
# match the private image it pulls and side-loads into kind.
image:
  repository: example.invalid/maestrod

# Skip the NUTRIENT_LICENSE_KEY env var so the pod can start without the
# external license Secret being pre-provisioned in the CI cluster. Real
# installs should keep the `licenseSecret.name` default (`maestrod-secret`).
licenseSecret:
  name: ""

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
